name: support-draft-service

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-local-demo}
      ALLOWED_REPLY_ORIGINS: '${ALLOWED_REPLY_ORIGINS:-["http://mock-helpdesk:8000"]}'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
      WORKER_PARALLELISM: ${WORKER_PARALLELISM:-32}
      ALLOWED_REPLY_ORIGINS: '${ALLOWED_REPLY_ORIGINS:-["http://mock-helpdesk:8000"]}'
      HELPDESK_API_TOKEN: ${HELPDESK_API_TOKEN:-local-mock-token}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${APP_PORT:-8000}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    depends_on:
      migrate:
        condition: service_completed_successfully

  mock-helpdesk:
    build: .
    command: ["uvicorn", "app.mock_helpdesk:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
      HELPDESK_API_TOKEN: ${HELPDESK_API_TOKEN:-local-mock-token}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-local-demo}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
