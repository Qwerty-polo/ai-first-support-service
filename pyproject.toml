[project]
name = "support-draft-service"
version = "0.1.0"
description = "Human-reviewed support drafts backed by PostgreSQL"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv313", ".python-runtime", ".stage-tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async switches through greenlets; track them to avoid missing resumed lines.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 90

[tool.mypy]
python_version = "3.13"
files = ["app"]
strict = true
